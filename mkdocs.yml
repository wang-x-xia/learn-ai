site_name: Learn AI — AI 前沿知识库
site_description: 个人 AI 前沿知识库，追踪技术方案革新与工程亮点
site_url: https://wang-x-xia.github.io/learn-ai/
repo_url: https://github.com/wang-x-xia/learn-ai

docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: coral
      accent: gold
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: coral
      accent: gold
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - zh
        - en
  - tags
  - social:
      enabled: !ENV [CI, false]

markdown_extensions:
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 基础理论:
    - foundations/index.md
    - Transformer 架构: foundations/transformer.md
    - KV Cache 与推理优化: foundations/kv-cache.md
    - Mamba 与 SSM: foundations/mamba-and-ssm.md
    - 多模态 AI: foundations/multimodal-ai.md
    - 扩散模型: foundations/diffusion-models.md
    - 从规则到表示学习: foundations/representation-learning.md
  - 应用技术:
    - applied/index.md
    - AI Agent 智能体: applied/ai-agents.md
    - Agent 记忆系统: applied/memory-systems.md
    - Agent 工具接入: applied/agent-tools.md
    - Agent Skills: applied/agent-skills.md
    - Agent 间协议: applied/agent-protocols.md
    - Agent Hooks: applied/agent-hooks.md
    - Subagent 实践: applied/subagents.md
    - Thinking Mode: applied/thinking-mode.md
    - 提示工程: applied/prompt-engineering.md
    - 检索增强生成 (RAG): applied/rag.md
    - AI 浏览器自动化: applied/browser-automation.md
    - AI 基础设施: applied/infrastructure.md
    - 推理经济性: applied/inference-economics.md
  - 前沿研究:
    - research/index.md
    - 可解释性: research/interpretability.md
    - AI 安全与治理: research/safety-and-governance.md
    - Engram: research/engram.md
  - 模型档案:
    - model/index.md
    - Claude Mythos Preview: model/claude-mythos.md
    - DeepSeek-V4: model/deepseek-v4.md
  - 产品档案:
    - 编码工具:
      - coding-agents/index.md
      - Claude Code: coding-agents/claude-code.md
    - 开源库:
      - libraries/index.md
      - libraries/honcho.md
    - Agent Workflow:
      - agent-workflow/index.md
      - LangGraph: agent-workflow/langgraph.md
      - Ruflo: agent-workflow/ruflo.md
      - Microsoft Agent Framework: agent-workflow/maf.md
      - Dify: agent-workflow/dify.md
      - NeMo Agent Toolkit: agent-workflow/nemo-agent-toolkit.md
    - 个人 Agent:
      - personal-agents/index.md
      - Hermes Agent: personal-agents/hermes-agent.md
      - OpenClaw: personal-agents/openclaw.md
  - 精选资源: resources.md


extra_css:
  - stylesheets/extra.css

extra:
  social: []
  generator: false
