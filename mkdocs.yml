site_name: Learn AI — AI 前沿知识库
site_description: 个人 AI 前沿知识库，追踪技术方案革新与工程亮点
site_url: https://wang-x-xia.github.io/learn-ai/
repo_url: https://github.com/wang-x-xia/learn-ai

docs_dir: docs
exclude_docs: |
  **/AGENTS.md

theme:
  name: material
  variant: classic
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: coral
      accent: gold
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: coral
      accent: gold
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - zh
        - en
  - tags
  - social:
      enabled: !ENV [CI, false]

markdown_extensions:
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - zensical.extensions.macros:
      module_name: scripts/macros
      on_error_fail: true
      include_yaml:
        changelog: docs/changelog.yaml

